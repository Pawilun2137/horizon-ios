# The iOS build (docs/ios.md): horizon-client for aarch64-apple-ios, packed into an unsigned
# Horizon.ipa. Every run uploads it as an artifact; every run that is not a pull request's is also
# published as an `ios-build-<run number>` prerelease with a changelog, and pushes to `ios`
# refresh the rolling `ios-latest` one.
name: iOS build
on:
  push:
    branches: [ios]
    # Text-only changes publish no new build.
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [ios, android]
    paths:
      - ".github/workflows/ios.yml"
      - "packaging/ios/**"
      - "tools/ios_package.sh"
      - "tools/ios_release.sh"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Instead of building: publish these earlier runs (IDs, oldest first) as releases"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.backfill == ''
    # Intel fallback while GitHub-hosted macOS ARM64 runner allocation is degraded.
    # Cross-compile to aarch64-apple-ios using the iPhoneOS SDK.
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      HORIZON_TELEMETRY_URL: "off"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ios-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Build
        # No `controllers` (gilrs and HID have no iOS backend) and no `mods` (wasm JIT).
        run: >
          cargo build --release --target aarch64-apple-ios
          -p horizon-client --bin horizon-client
          --no-default-features --features audio
      - name: Package
        run: tools/ios_package.sh target/aarch64-apple-ios/release/horizon-client .local/ios
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa
          path: .local/ios/Horizon.ipa
          if-no-files-found: error
  release:
    # Every successful build that is not a pull request's is published as its own prerelease,
    # `ios-build-<run number>`, with the commits since the previous one as its changelog.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Horizon-ipa
          path: .local/ios
      - name: Publish ios-build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          tools/ios_release.sh "${{ github.run_number }}" "$GITHUB_SHA" "$GITHUB_REF_NAME"
          .local/ios/Horizon.ipa
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Refresh the ios-latest prerelease
        if: github.ref == 'refs/heads/ios'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ios-latest --cleanup-tag --yes || true
          gh release create ios-latest .local/ios/Horizon.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iOS test build (${GITHUB_SHA::7})" \
            --notes "The newest build from the \`ios\` branch; every build is also its own ios-build-N release."
  backfill:
    # Earlier runs' artifacts as `ios-build-<run number>` releases, as `release` publishes new
    # ones. Artifacts expire after 90 days.
    if: github.event_name == 'workflow_dispatch' && inputs.backfill != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish each run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ inputs.backfill }}
        run: |
          for run in $RUNS; do
            case "$run" in *[!0-9]*) echo "not a run ID: $run"; exit 1;; esac
            info=$(gh api "repos/$GH_REPO/actions/runs/$run" \
              --jq '[.run_number, .head_sha, .head_branch, .html_url, .conclusion] | @tsv')
            number=$(echo "$info" | cut -f1)
            sha=$(echo "$info" | cut -f2)
            branch=$(echo "$info" | cut -f3)
            url=$(echo "$info" | cut -f4)
            conclusion=$(echo "$info" | cut -f5)
            if [ "$conclusion" != success ]; then
              echo "run $run: $conclusion, skipped"
              continue
            fi
            dir=".local/backfill/$run"
            mkdir -p "$dir"
            gh run download "$run" --name Horizon-ipa --dir "$dir"
            tools/ios_release.sh "$number" "$sha" "$branch" "$dir/Horizon.ipa" "$url"
          done
